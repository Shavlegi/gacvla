# 2026-11-10: off-peak minutes 7,37 to dodge GitHub's top-of-hour load — no other change
name: Update rates

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Scrape rates
        run: python scraper/scrape.py
      - name: Commit if changed
        run: |
          git config user.name "gacvla-bot"
          git config user.email "gacvla-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update rates"
          git push
